name: Release v0.8.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .release-v082.ready

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.8.2", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.8.2 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.8.2             --target "${GITHUB_SHA}"             --title "Announcement Hub v0.8.2"             --notes "Fixes the Snapcast setup crash caused by treating SelectOption objects as dictionaries. Also includes the 0.8.1 notification setup fixes: all recognised notification outputs are preselected and notification-group labels are translated."
