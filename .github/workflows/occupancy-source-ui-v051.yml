name: Apply occupancy source dropdown UI

on:
  push:
    branches:
      - main
    paths:
      - .occupancy-source-ui-v051.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-occupancy-source-v051
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply occupancy source UI
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .occupancy-source-ui-v051.ready
          test -f .occupancy-source-ui-v051.py
          python -m py_compile .occupancy-source-ui-v051.py
          python .occupancy-source-ui-v051.py
          rm -f .occupancy-source-ui-v051.py .occupancy-source-ui-v051.ready

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/announcement_hub")
          manifest = json.loads((component / "manifest.json").read_text())
          flow = (component / "config_flow.py").read_text()
          manager = (component / "manager.py").read_text()

          assert manifest["version"] == "0.5.1"
          assert "async def async_step_occupancy(" in flow
          assert "async def async_step_occupancy_source(" in flow
          assert 'return ["__state__", *attributes]' in flow
          assert 'translation_key="occupancy_source"' in flow
          assert "self.hass.async_create_task(" not in manager
          assert manager.count("self.entry.async_create_background_task(") == 2
          PY
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Add translated occupancy source dropdown"
          git push origin HEAD:main
