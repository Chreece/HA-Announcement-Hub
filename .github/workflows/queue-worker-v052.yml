name: Apply queue-worker supervision

on:
  push:
    branches:
      - main
    paths:
      - .queue-worker-v052.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .queue-worker-v052.ready
          test -f .queue-worker-v052.py
          python -m py_compile .queue-worker-v052.py
          python .queue-worker-v052.py
          rm -f .queue-worker-v052.py .queue-worker-v052.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          m=(c/"manager.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.5.2"
          assert "def _ensure_worker(self)" in m
          assert "self.hass.loop.call_soon(self._ensure_worker)" in m
          assert "self.hass.async_create_task(" not in m
          assert m.count("self.entry.async_create_background_task(")==2
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Supervise and recover announcement queue worker"
          git push origin HEAD:main
