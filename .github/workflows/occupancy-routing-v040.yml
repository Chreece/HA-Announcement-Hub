name: Apply occupancy-aware routing

on:
  push:
    branches:
      - main
    paths:
      - .occupancy-routing-v040.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-occupancy-routing-v040
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply occupancy-aware routing
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .occupancy-routing-v040.ready
          test -f .occupancy-routing-v040.py
          python -m py_compile .occupancy-routing-v040.py
          python .occupancy-routing-v040.py
          rm -f .occupancy-routing-v040.py .occupancy-routing-v040.ready

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/announcement_hub")
          manifest = json.loads((component / "manifest.json").read_text())
          manager = (component / "manager.py").read_text()
          init = (component / "__init__.py").read_text()
          assert manifest["version"] == "0.4.0"
          assert "def _occupied_area_ids(" in manager
          assert "occupancy_filter_active = occupied_area_ids is not None" in manager
          assert "ATTR_OCCUPIED_ONLY" in init
          assert "self.hass.async_create_task(" not in manager
          assert manager.count("self.entry.async_create_background_task(") == 2
          PY
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Add occupancy-aware area routing"
          git push origin HEAD:main
