name: Bootstrap Announcement Hub source

on:
  push:
    branches:
      - main
    paths:
      - .announcement_hub_source_v0.2.0.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .announcement_hub_source_v0.2.0.tar.gz.b64
          base64 --decode .announcement_hub_source_v0.2.0.tar.gz.b64 > /tmp/announcement_hub_source.tar.gz
          echo "d7832e33336574734e00fdf87752d9aa42117ab96f79d32ae58049bef1f2c3e0  /tmp/announcement_hub_source.tar.gz" | sha256sum --check --strict

      - name: Materialize repository files
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -xzf /tmp/announcement_hub_source.tar.gz -C .
          rm .announcement_hub_source_v0.2.0.tar.gz.b64

      - name: Validate source
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q custom_components tests
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m pytest -q

      - name: Commit source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Add Announcement Hub v0.2.0"
          git push origin HEAD:main
