name: Release v0.8.3

on:
  push:
    branches:
      - main
    paths:
      - .release-v083.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.8.3", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.8.3 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.8.3             --target "${GITHUB_SHA}"             --title "Announcement Hub v0.8.3"             --notes "Setup polish: complete translated labels and per-field explanations, TTS language dropdown from supported engine languages, and corrected Snapcast integration-options naming."
