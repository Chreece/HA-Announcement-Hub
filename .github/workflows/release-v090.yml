name: Release v0.9.0

on:
  push:
    branches:
      - main
    paths:
      - .release-v090.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.0", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.0             --target "${GITHUB_SHA}"             --title "Announcement Hub v0.9.0"             --notes "Immediate availability-aware fallback across notification and TTS output types. Uses normal level matches when available; otherwise immediately selects the available output tier nearest to the announcement level. Preferred unavailable outputs no longer delay an available fallback."
