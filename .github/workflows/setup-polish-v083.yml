name: Apply setup polish v0.8.3

on:
  push:
    branches:
      - main
    paths:
      - .setup-polish-v083.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .setup-polish-v083.ready
          test -f .setup-polish-v083.py
          python -m py_compile .setup-polish-v083.py
          python .setup-polish-v083.py
          rm -f .setup-polish-v083.py .setup-polish-v083.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          f=(c/"config_flow.py").read_text()
          o=(c/"outputs.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.8.3"
          assert "tts_engine_languages(self.hass" in f
          assert "tts_default_language(self.hass" in f
          assert "supported_languages" in o
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Polish setup labels help and TTS language selection"
          git push origin HEAD:main
