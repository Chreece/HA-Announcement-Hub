name: Apply silent unavailable-output policy

on:
  push:
    branches:
      - main
    paths:
      - .silent-unavailable-fix.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-silent-unavailable-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply silent unavailable-output policy
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .silent-unavailable-fix.ready
          test -f .silent-unavailable-fix.py
          echo "b5f7c367bc46a97c84bb3dee17ccadf87c4191d4f334ec489848bd5f6a300f46  .silent-unavailable-fix.py" | sha256sum --check --strict
          python -m py_compile .silent-unavailable-fix.py
          python .silent-unavailable-fix.py
          rm -f .silent-unavailable-fix.py .silent-unavailable-fix.ready

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/announcement_hub")
          manifest = json.loads((component / "manifest.json").read_text())
          manager = (component / "manager.py").read_text()
          assert manifest["version"] == "0.3.4"
          assert "if not job.successful_channels and job.channel_errors:" in manager
          assert "self._record_channel_failure(job, channel_name, error)" not in manager
          assert "Delivery did not succeed within" not in manager
          assert "self.hass.async_create_task(" not in manager
          assert manager.count("self.entry.async_create_background_task(") == 2
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Silently skip unavailable announcement outputs"
          git push origin HEAD:main
