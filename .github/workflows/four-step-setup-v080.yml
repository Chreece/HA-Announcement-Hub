name: Apply four-step auto-discovery setup

on:
  push:
    branches:
      - main
    paths:
      - .four-step-setup-v080.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .four-step-setup-v080.ready
          test -f .four-step-setup-v080.py
          python -m py_compile .four-step-setup-v080.py
          python .four-step-setup-v080.py
          rm -f .four-step-setup-v080.py .four-step-setup-v080.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          f=(c/"config_flow.py").read_text()
          o=(c/"outputs.py").read_text()
          m=(c/"manager.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.8.0"
          assert "tts.async_default_engine" in o
          assert "selector.LabelSelector()" in f
          assert "CONF_NOTIFY_ROOM_OUTPUTS" in f
          assert "CONF_TTS_AREA_PLAYERS" in f
          assert "self.hass.async_create_task(" not in m
          assert m.count("self.entry.async_create_background_task(")==2
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Rework setup around auto-discovered outputs"
          git push origin HEAD:main
