name: Apply NFAndroidTV runtime delivery fix

on:
  push:
    branches:
      - main
    paths:
      - .nfandroidtv-runtime-fix.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-nfandroidtv-runtime-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply runtime-client fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .nfandroidtv-runtime-fix.ready
          test -f .nfandroidtv-runtime-fix.py
          python -m py_compile .nfandroidtv-runtime-fix.py
          python .nfandroidtv-runtime-fix.py
          rm -f .nfandroidtv-runtime-fix.py .nfandroidtv-runtime-fix.ready

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/announcement_hub")
          manifest = json.loads((component / "manifest.json").read_text())
          manager = (component / "manager.py").read_text()
          assert manifest["version"] == "0.3.3"
          assert "async def _async_send_nfandroidtv_runtime(" in manager
          assert 'client = getattr(entry, "runtime_data", None)' in manager
          assert 'bkgcolor=data.get("bkgcolor", data.get("color"))' in manager
          assert "no active advanced delivery path" in manager
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Fix Android TV runtime notification delivery"
          git push origin HEAD:main
