name: Release v0.9.17

on:
  push:
    branches:
      - main
    paths:
      - .release-v0917.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.17", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.17 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.17 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.17" \
            --notes "Adds conservative automatic NFAndroidTV-to-media_player power association using shared device identity or exact host/IP matching. An associated TV that is off, unavailable, or unknown now makes the room notification unavailable so the existing room TTS fallback can be selected. Names are never used for matching; ambiguous/no-match cases keep normal notify availability."
