name: Evaluate translation quality (public UI strings)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/translation-quality-evaluation.yml

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install trial public-text translator
        run: python -m pip install --disable-pip-version-check "deep-translator==1.11.4"
      - name: Compare difficult public UI phrases
        run: |
          python - <<'PY'
          from deep_translator import GoogleTranslator
          messages = [
            "Direct media players that receive generated TTS only when their Home Assistant area matches the occupied/fallback room. Every player selected here is automatically room-scoped.",
            "Fallback TTS area used only when the current target room set contains zero fixed room candidates at all. Existing fixed room candidates, including unavailable/unknown ones, block fallback and remain subject to the normal availability timeout.",
            "Home Assistant default follows the conversation agent of your preferred Assist pipeline, rather than the built-in conversation.process intent agent. The selected agent is resolved at send time and shown in the dropdown. If your preferred pipeline uses the built-in agent, select an LLM-backed agent explicitly or configure a backup.",
            "When enabled, Announcement Hub changes mute state only for clients that are already on the configured announcement source; other Snapcast groups/sources are left untouched.",
          ]
          for target in ["fr", "es", "ko"]:
            print("LANGUAGE",target,flush=True)
            obj=GoogleTranslator(source="en",target=target)
            for i,m in enumerate(messages):
              try:
                print(i,repr(obj.translate(m)),flush=True)
              except Exception as err:
                print(i,"FAILED",type(err).__name__,flush=True)
          PY
