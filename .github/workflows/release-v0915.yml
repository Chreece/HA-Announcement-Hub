name: Release v0.9.15

on:
  push:
    branches:
      - main
    paths:
      - .release-v0915.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.15", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.15 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.15 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.15" \
            --notes "Fixes room-level routing so a valid same-room notification candidate at the announcement level prevents below-threshold TTS from being relaxed. TTS is relaxed only when no fixed-room candidate survives the level filter; fallback now requires zero fixed-room candidates, and unavailable/unknown TTS targets still wait once TTS is legitimately selected."
