name: Apply selected Snapcast source fix v0.9.4

on:
  push:
    branches:
      - main
    paths:
      - .snapcast-selected-source-v094.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .snapcast-selected-source-v094.ready
          test -f .snapcast-selected-source-v094.py
          python -m py_compile .snapcast-selected-source-v094.py
          python .snapcast-selected-source-v094.py
          rm -f .snapcast-selected-source-v094.py .snapcast-selected-source-v094.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          m=(c/"manager.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.9.4"
          block=m[m.index("def _snapcast_output_available"):m.index("def _routable_snapcast_snapshot")]
          assert "_snapcast_source_matches" not in block
          snap=m[m.index("def _routable_snapcast_snapshot"):m.index("async def _async_apply_snapcast_route")]
          assert "entity_id not in selected_set" in snap
          assert "self.hass.async_create_task(" not in m
          assert m.count("self.entry.async_create_background_task(")==2
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Use selected Snapcast clients as TTS source membership"
          git push origin HEAD:main
