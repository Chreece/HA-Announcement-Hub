name: Apply NFAndroidTV position fix

on:
  push:
    branches:
      - main
    paths:
      - .nfandroidtv-position-fix.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-nfandroidtv-position-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply NFAndroidTV delivery fix
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .nfandroidtv-position-fix.ready
          test -f .nfandroidtv-position-fix.py
          echo "504f32a104db722ace98e453e0699c062ef034c94da22ee97a1bd074a83869db  .nfandroidtv-position-fix.py" | sha256sum --check --strict
          python -m py_compile .nfandroidtv-position-fix.py
          python .nfandroidtv-position-fix.py
          rm -f .nfandroidtv-position-fix.py .nfandroidtv-position-fix.ready

      - name: Repair generated regression-test quoting
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_nfandroidtv_advanced_delivery.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "hass.services.has_service("notify", service_name)" in outputs\n'
          new = '    assert \'hass.services.has_service("notify", service_name)\' in outputs\n'
          if text.count(old) != 1:
              raise SystemExit("Expected generated assertion was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/announcement_hub/manifest.json").read_text()
          )
          assert manifest["version"] == "0.3.2"
          outputs = Path("custom_components/announcement_hub/outputs.py").read_text()
          manager = Path("custom_components/announcement_hub/manager.py").read_text()
          assert "service_name = slugify(str(entry.title))" in outputs
          assert "position/style data cannot be applied" in manager
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Fix Android TV notification positioning"
          git push origin HEAD:main
