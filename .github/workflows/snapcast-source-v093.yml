name: Apply Snapcast source resolution v0.9.3

on:
  push:
    branches:
      - main
    paths:
      - .snapcast-source-v093.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .snapcast-source-v093.ready
          test -f .snapcast-source-v093.py
          python -m py_compile .snapcast-source-v093.py
          python .snapcast-source-v093.py
          rm -f .snapcast-source-v093.py .snapcast-source-v093.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          m=(c/"manager.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.9.3"
          assert "def _snapcast_source_matches" in m
          assert "streams = group.streams_by_name()" in m
          assert "return self._snapcast_source_matches(entity_id)" in m
          assert "self.hass.async_create_task(" not in m
          assert m.count("self.entry.async_create_background_task(")==2
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Resolve Snapcast friendly TTS source to stream ID"
          git push origin HEAD:main
