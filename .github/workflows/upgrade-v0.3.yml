name: Apply Announcement Hub v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - .upgrade-v0.3.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-v0.3-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reconstruct and verify upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .upgrade-v0.3.ready
          shopt -s nullglob
          parts=(.upgrade-v0.3/part-*)
          test "${#parts[@]}" -eq 4
          cat "${parts[@]}" > /tmp/upgrade-v0.3.py.gz.b64
          base64 --decode /tmp/upgrade-v0.3.py.gz.b64 > /tmp/upgrade-v0.3.py.gz
          echo "30460d6e8211cec28b1b4f6aac99ab2874a6a2a100e5cdb0efbe892f7ddf9acb  /tmp/upgrade-v0.3.py.gz" | sha256sum --check --strict
          gzip -dc /tmp/upgrade-v0.3.py.gz > /tmp/upgrade-v0.3.py
          python -m py_compile /tmp/upgrade-v0.3.py

      - name: Apply v0.3.0 source changes
        run: python /tmp/upgrade-v0.3.py

      - name: Remove temporary payload files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .upgrade-v0.3
          rm -f .upgrade-v0.3.ready

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('.').rglob('*.yaml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          manifest = json.loads(Path('custom_components/announcement_hub/manifest.json').read_text())
          assert manifest['version'] == '0.3.0'
          assert Path('custom_components/announcement_hub/message_parts.py').is_file()
          PY

      - name: Keep workflow changes outside the source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/validate.yml
          git checkout -- .github/workflows/upgrade-v0.3.yml

      - name: Commit v0.3.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Add per-integration notification profiles"
          git push origin HEAD:main
