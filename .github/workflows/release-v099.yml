name: Release v0.9.9

on:
  push:
    branches:
      - main
    paths:
      - .release-v099.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.9", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.9 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.9 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.9" \
            --notes "Uses exactly one active TTS engine and fixes voice discovery for Wyoming/Piper and other providers. Locale-compatible voices such as el with el_GR are merged, the voice field remains available for providers that support voice without enumerating it, and engine/language changes refresh the setup page so the correct voice choices are loaded before saving."
