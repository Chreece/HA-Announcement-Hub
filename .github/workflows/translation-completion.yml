name: Validate offline translation pipeline
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/translation-completion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation tooling
        run: |
          python -m pip install --disable-pip-version-check "torch==2.5.1" "transformers==4.47.1" "sentencepiece>=0.2" "sacremoses>=0.1"
      - name: Verify public model and sample French translation
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m compileall -q scripts/complete_localizations.py
          python scripts/complete_localizations.py --languages fr --limit 8 --dry-run
