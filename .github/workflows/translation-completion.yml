name: Translation quality audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Check translation schemas, card and provider labels
        run: |
          python -m compileall -q custom_components tests
          python -m pytest -q tests/test_international_localizations.py tests/test_localized_provider_labels.py tests/test_dashboard_card_integration.py tests/test_person_locales_completion.py
          node --test tests/test_announcement_hub_card.mjs
