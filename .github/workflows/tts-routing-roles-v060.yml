name: Apply three-role TTS routing

on:
  push:
    branches:
      - main
    paths:
      - .tts-routing-roles-v060.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .tts-routing-roles-v060.ready
          test -f .tts-routing-roles-v060.py
          python -m py_compile .tts-routing-roles-v060.py
          python .tts-routing-roles-v060.py
          rm -f .tts-routing-roles-v060.py .tts-routing-roles-v060.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          m=(c/"manager.py").read_text()
          model=(c/"models.py").read_text()
          flow=(c/"config_flow.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.6.0"
          assert "CONF_TTS_ROOM_PLAYERS" in flow
          assert "room_tts_players" in model
          assert "def _job_has_ready_room_tts(" in m
          assert "async def _async_send_room_tts(" in m
          assert "self.hass.async_create_task(" not in m
          assert m.count("self.entry.async_create_background_task(")==2
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Split direct, shared, and routing TTS players"
          git push origin HEAD:main
