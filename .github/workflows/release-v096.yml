name: Release v0.9.6

on:
  push:
    branches:
      - main
    paths:
      - .release-v096.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.6", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.6 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.6 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.6" \
            --notes "Fixes occupied-room routing so movable outputs no longer count as room candidates. Room-local outputs are selected by announcement level with nearest-threshold relaxation when needed. Default-room fallback is now TTS-only and keeps visual/general notifications on their original outputs, with the configured door gate and normal availability waiting preserved."
