name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest pyyaml
      - run: python -m compileall -q custom_components tests
      - run: python -m pytest -q
      - name: Validate announcement dashboard JavaScript
        run: |
          node --check custom_components/announcement_hub/frontend/announcement-hub-card.js
          node --test tests/test_announcement_hub_card.mjs
