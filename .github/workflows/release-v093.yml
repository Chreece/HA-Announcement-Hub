name: Release v0.9.3

on:
  push:
    branches:
      - main
    paths:
      - .release-v093.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.3", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.3 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.3             --target "${GITHUB_SHA}"             --title "Announcement Hub v0.9.3"             --notes "Fixes Snapcast TTS-room detection by resolving the configured friendly source name to the actual Snapcast stream identifier after room-area filtering. Area matching remains strict and Music clients are not accepted as TTS outputs."
