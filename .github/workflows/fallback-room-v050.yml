name: Apply fallback-room routing

on:
  push:
    branches:
      - main
    paths:
      - .fallback-room-v050.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcement-hub-fallback-room-v050
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply fallback-room routing
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .fallback-room-v050.ready
          test -f .fallback-room-v050.py
          python -m py_compile .fallback-room-v050.py
          python .fallback-room-v050.py
          rm -f .fallback-room-v050.py .fallback-room-v050.ready

      - name: Validate integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/announcement_hub")
          manifest = json.loads((component / "manifest.json").read_text())
          manager = (component / "manager.py").read_text()
          config_flow = (component / "config_flow.py").read_text()

          assert manifest["version"] == "0.5.0"
          assert "if occupancy_filter_active and not plan.has_output:" in manager
          assert "def _fallback_door_allows(" in manager
          assert 'state.attributes.get("device_class") != "door"' in manager
          assert "state.state == STATE_ON" in manager
          assert "CONF_FALLBACK_ROOM" in config_flow
          assert "CONF_FALLBACK_CHECK_DOOR" in config_flow
          assert "self.hass.async_create_task(" not in manager
          assert manager.count("self.entry.async_create_background_task(") == 2
          PY
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Add fallback room for zero-candidate occupancy routing"
          git push origin HEAD:main
