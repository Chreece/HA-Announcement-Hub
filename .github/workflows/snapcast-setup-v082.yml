name: Apply Snapcast setup crash fix

on:
  push:
    branches:
      - main
    paths:
      - .snapcast-setup-v082.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .snapcast-setup-v082.ready
          test -f .snapcast-setup-v082.py
          python -m py_compile .snapcast-setup-v082.py
          python .snapcast-setup-v082.py
          rm -f .snapcast-setup-v082.py .snapcast-setup-v082.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          o=(c/"outputs.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.8.2"
          block=o[o.index("def snapcast_output_options"):o.index("def companion_tts_output_options")]
          assert 'option["value"]' not in block
          assert "option.value" in block
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Fix Snapcast option discovery crash"
          git push origin HEAD:main
