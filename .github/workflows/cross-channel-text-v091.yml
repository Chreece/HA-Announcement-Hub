name: Apply cross-channel text delivery fix

on:
  push:
    branches:
      - main
    paths:
      - .cross-channel-text-v091.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .cross-channel-text-v091.ready
          test -f .cross-channel-text-v091.py
          python -m py_compile .cross-channel-text-v091.py
          python .cross-channel-text-v091.py
          rm -f .cross-channel-text-v091.py .cross-channel-text-v091.ready
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m compileall -q custom_components tests
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("custom_components/announcement_hub")
          m=(c/"manager.py").read_text()
          models=(c/"models.py").read_text()
          assert json.loads((c/"manifest.json").read_text())["version"]=="0.9.1"
          assert '"native_text": bool(text_notify or text_tts)' in m
          assert m.count('"native_text": bool(text_tts or text_notify)')==3
          assert "notify_text = text_notify or text_tts" in models
          assert "self.hass.async_create_task(" not in m
          assert m.count("self.entry.async_create_background_task(")==2
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Fix cross-channel text delivery"
          git push origin HEAD:main
