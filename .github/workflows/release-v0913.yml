name: Release v0.9.13

on:
  push:
    branches:
      - main
    paths:
      - .release-v0913.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.13", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.13 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.13 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.13" \
            --notes "Fixes a planner bug where adding text_notify could suppress an otherwise valid TTS route. TTS and visual level routing are now selected independently, unavailable/unknown TTS targets remain frozen for the full timeout, and TTS fallback remains available after level relaxation."
