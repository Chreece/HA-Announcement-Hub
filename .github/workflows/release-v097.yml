name: Release v0.9.7

on:
  push:
    branches:
      - main
    paths:
      - .release-v097.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.7", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.7 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.7 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.7" \
            --notes "Continuous TTS pipeline: queued speech now renders in the background while the current announcement plays, independent audio outputs launch in parallel, visual delivery no longer serializes speech, queued audio skips deliberate post-play gaps, and identical prepared Snapcast routes are handed directly to the next announcement before restoring the original mute state."
