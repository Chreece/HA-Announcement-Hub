name: Release v0.9.10

on:
  push:
    branches:
      - main
    paths:
      - .release-v0910.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/announcement_hub/manifest.json").read_text())
          assert manifest["version"]=="0.9.10", manifest
          PY
          python -m compileall -q custom_components tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.9.10 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.9.10 \
            --target "${GITHUB_SHA}" \
            --title "Announcement Hub v0.9.10" \
            --notes "Delivery-safety release: prevents Snapcast tail clipping before route restore, keeps gapless same-route handoff, makes explicit output areas constrain planning even without occupancy, preserves General/movable outputs when no occupied room exists, and blocks a media player from being used simultaneously as Direct TTS and the shared Snapcast source."
