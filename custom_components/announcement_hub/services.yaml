send:
  fields:
    content:
      fields:
        text:
          required: false
          example: The washing machine has finished.
          selector:
            text:
              multiline: true
        text_tts:
          example: The washing machine has finished.
          selector:
            text:
              multiline: true
        text_notify:
          example: Washing machine finished
          selector:
            text:
              multiline: true
        title:
          selector:
            text:
        click_action:
          example: /lovelace/cameras
          selector:
            text:
        level:
          default: info
          selector:
            select:
              options:
                - critical
                - error
                - warning
                - info
                - success
                - debug
              translation_key: level
    routing:
      fields:
        area:
          selector:
            area:
              multiple: true
        manual_targets:
          default: false
          selector:
            boolean:
        target_person:
          selector:
            entity:
              domain: person
              multiple: true
        person_destination:
          default:
            - room
          selector:
            select:
              multiple: true
              options:
                - room
                - mobile
                - watch
                - tablet
                - other
              translation_key: person_destination
        person_translate:
          selector:
            boolean:
        person_greeting:
          selector:
            boolean:
        pre_announce_sound:
          selector:
            boolean:
        integration:
          example:
            - mobile_app
            - nfandroidtv
          selector:
            text:
              multiple: true
        device:
          selector:
            device:
              multiple: true
        entity:
          selector:
            entity:
              multiple: true
              filter:
                - domain: notify
                - domain: media_player
        service:
          selector:
            select:
              multiple: true
              options:
                - notification
                - tts
                - snapcast
                - companion_tts
                - all
        companion_tts:
          default: false
          selector:
            boolean:
        occupied_only:
          default: true
          selector:
            boolean:
    ai:
      fields:
        use_ai:
          selector:
            boolean:
        ai_agent:
          example: ai_task.openai_ai_task
          selector:
            text:
        ai_mode:
          default: rewrite
          selector:
            select:
              options:
                - rewrite
                - generate
    advanced:
      collapsed: true
      fields:
        notify_data:
          selector:
            object:
        language:
          selector:
            text:
        tts_options:
          selector:
            object:
        tts_engine:
          selector:
            entity:
              domain: tts

clear_queue:
  description: Clear waiting announcements. With include_current, cancel all active Hub deliveries and stop Hub-owned audio; already delivered push notifications cannot be recalled.
  fields:
    include_current:
      name: Include active announcements
      description: Also request immediate cancellation of active Hub outputs. Does not pause future announcements.
      default: false
      selector:
        boolean:

cancel:
  fields:
    job_id:
      required: true
      selector:
        text:
